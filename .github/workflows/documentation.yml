name: Documentation
run-name: "${{ inputs.dependabot_pr && format('Dependabot documentation PR #{0}', inputs.dependabot_pr) || github.event.pull_request.title || github.event.head_commit.message || 'Documentation' }}"
on:
  push:
    branches: [main]
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      dependabot_pr:
        description: Merged Dependabot PR whose publication is being refreshed
        type: string
        required: false
concurrency:
  group: documentation-publishing
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Develop ToQUBO.jl
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd())'
      - uses: julia-actions/julia-buildpkg@latest
        with: 
            project: "docs"
      - name: Build docs
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: julia --project=docs docs/make.jl --skip-deploy
      - name: Build and deploy
        if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
        run: julia --project=docs docs/make.jl
